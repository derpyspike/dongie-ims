name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

      - name: Build for the stick (static arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dongie-ims .

      - name: Check the binary is static aarch64
        run: |
          file dongie-ims
          file dongie-ims | grep -q 'ARM aarch64' && file dongie-ims | grep -q 'statically linked'

      - uses: actions/upload-artifact@v4
        with:
          name: dongie-ims-aarch64-linux
          path: dongie-ims

  release:
    # tags are created (and signed) by hand; this attaches the binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build + package binary and complete source (vendored modules)
        run: sh .github/package-release.sh "$GITHUB_REF_NAME"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --verify-tag --title "dongie-ims $tag" \
              --notes "Static arm64 binary for MSM8916 sticks, plus complete source with vendored Go modules (GPL-3.0). Check with SHA256SUMS."
          gh release upload "$tag" dist/* --clobber
